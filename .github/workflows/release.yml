name: Build and Release APK

# Trigger conditions:
#  - Any push to master that touches CHANGELOG.md (the workflow then checks
#    whether the top non-Unreleased version differs from the latest tag).
#  - Manual dispatch (useful for re-running a failed publish).
#
# A release is two APKs, signed with the same upload key:
#  - AimBuddy-v<version>.apk        the app (com.aimbuddy)
#  - AimBuddy-v<version>-debug.apk  a debuggable build that installs beside it (com.aimbuddy.debug)
on:
  push:
    branches: [master]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write   # required to create releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: read the changelog, decide whether this commit introduces a new
  # version that has not yet been released.
  # ---------------------------------------------------------------------------
  detect-version:
    name: Detect new changelog version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
      release_notes: ${{ steps.read.outputs.release_notes }}
      release_date: ${{ steps.read.outputs.release_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need full history so we can list tags

      - name: Parse top released version from CHANGELOG.md
        id: read
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG="CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            echo "CHANGELOG.md not found; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Grab the first '## [x.y.z] - YYYY-MM-DD' heading that is NOT
          # the [Unreleased] placeholder.
          HEADER=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$CHANGELOG" || true)
          if [ -z "$HEADER" ]; then
            echo "No released-version heading found in CHANGELOG.md."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(echo "$HEADER" | sed -E 's/^## \[([^]]+)\] - .*/\1/')
          RELEASE_DATE=$(echo "$HEADER" | sed -E 's/.* - ([0-9-]+)$/\1/')
          TAG="v${VERSION}"
          echo "Detected version: ${VERSION} (date: ${RELEASE_DATE}, tag: ${TAG})"

          # Skip if the tag already exists on origin.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag ${TAG} already exists on origin; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract the changelog section for this version (from this heading
          # to the next '## [' heading, exclusive).
          awk -v ver="${VERSION}" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\] - ") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG" > release_notes.md

          # Strip the blank lines around the section and the '---' rule that
          # separates it from the version below.
          awk '
            { lines[NR] = $0 }
            END {
              first = 1
              last = NR
              while (first <= last && lines[first] == "") first++
              while (last >= first && (lines[last] == "" || lines[last] == "---")) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' release_notes.md > release_notes.trimmed
          mv release_notes.trimmed release_notes.md

          # Every release page ends with the same note on which file to take.
          {
            echo
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-footer.md
          } >> release_notes.md

          # Emit outputs. Multiline release notes use the GH Actions heredoc trick.
          {
            echo "version=${VERSION}"
            echo "release_date=${RELEASE_DATE}"
            echo "should_release=true"
            echo "release_notes<<RELEASE_NOTES_END"
            cat release_notes.md
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Step 2: build the release APK and the debug APK, sign both with the upload
  # keystore, and check them. Runs only when detect-version says so.
  # ---------------------------------------------------------------------------
  build:
    name: Build and check the APKs
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk_dir: ${{ steps.locate.outputs.apk_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify app version matches changelog
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION=$(grep -E '^aimbuddy\.versionName=' gradle.properties | head -n1 | cut -d'=' -f2-)
          CHANGELOG_VERSION="${{ needs.detect-version.outputs.version }}"
          echo "gradle.properties aimbuddy.versionName : ${GRADLE_VERSION}"
          echo "Changelog version                      : ${CHANGELOG_VERSION}"
          if [ "${GRADLE_VERSION}" != "${CHANGELOG_VERSION}" ]; then
            echo "ERROR: aimbuddy.versionName in gradle.properties (${GRADLE_VERSION}) does not match latest CHANGELOG entry (${CHANGELOG_VERSION})."
            echo "Bump aimbuddy.versionName in gradle.properties to ${CHANGELOG_VERSION} and re-push."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The release keystore is mandatory. Android keys an installed app on
      # (applicationId, signing certificate), so every AimBuddy release has to be
      # signed with the SAME certificate, otherwise users get "package conflicts
      # with an existing package" and cannot upgrade. Falling back to an unsigned
      # or debug-signed APK here would silently publish an un-upgradable build.
      - name: Decode signing keystore (required)
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${KEYSTORE_BASE64:-}" ]  || MISSING="$MISSING KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ]         || MISSING="$MISSING KEY_ALIAS"
          [ -n "${KEY_PASSWORD:-}" ]      || MISSING="$MISSING KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "ERROR: missing repository secret(s):$MISSING"
            echo "A release cannot be published without the stable upload keystore."
            echo "See docs/Releasing.md for how to generate and register it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_PATH="$RUNNER_TEMP/keystore/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      # With the keystore in the environment Gradle signs the debug build with it too
      # (see signingConfig in app/build.gradle), so debug files can update one another.
      - name: Build the release and debug APKs
        env:
          AIMBUDDY_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          AIMBUDDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AIMBUDDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AIMBUDDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Name the APKs
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect-version.outputs.version }}"
          OUT="${RUNNER_TEMP}/apks"
          mkdir -p "${OUT}"
          for variant in release debug; do
            if [ ! -f "app/build/outputs/apk/${variant}/app-${variant}.apk" ]; then
              echo "No ${variant} APK under app/build/outputs/apk/${variant}."
              ls -R app/build/outputs || true
              exit 1
            fi
          done
          cp app/build/outputs/apk/release/app-release.apk "${OUT}/AimBuddy-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${OUT}/AimBuddy-v${VERSION}-debug.apk"
          echo "apk_dir=${OUT}" >> "$GITHUB_OUTPUT"
          ls -lh "${OUT}"

      # Stops the release when the APKs are not what they should be. The one that
      # matters most: both must be signed with the same key as the previous release,
      # or a changed key would give "package conflicts with an existing package" on upgrade.
      - name: Check the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-apks.sh "${{ steps.locate.outputs.apk_dir }}" "${{ needs.detect-version.outputs.version }}"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: ${{ steps.locate.outputs.apk_dir }}/*.apk
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Step 3: create the GitHub Release and attach both APKs.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [detect-version, build]
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: ./release

      # target_commitish pins the tag to the commit that was built, even when
      # master has moved on while the build was running.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AimBuddy v${{ needs.detect-version.outputs.version }}
          body: ${{ needs.detect-version.outputs.release_notes }}
          draft: false
          prerelease: ${{ contains(needs.detect-version.outputs.version, '-') }}
          files: |
            ./release/AimBuddy-v${{ needs.detect-version.outputs.version }}.apk
            ./release/AimBuddy-v${{ needs.detect-version.outputs.version }}-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
