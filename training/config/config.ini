[paths]
dataset_dir = dataset
videos_dir = videos
raw_frames_dir = raw_frames
output_dir = outputs
base_model = yolo26n.pt

[training]
# Train at a HIGHER imgsz than the runtime model to learn small/distant
# targets. The exported NCNN model still runs at runtime_imgsz on device.
imgsz = 640
runtime_imgsz = 256
epochs = 180
batch = 16
patience = 25
workers = 4
device = auto
project = outputs/runs/detect
run_name = train
seed = 42
optimizer = AdamW
lr0 = 0.01
lrf = 0.01
close_mosaic = 15
single_cls = true

[augmentation]
# Stronger augmentation = better generalization across maps, outfits, poses.
hsv_h = 0.015
hsv_s = 0.70
hsv_v = 0.45
degrees = 5.0
translate = 0.10
scale = 0.60
shear = 2.0
perspective = 0.0
flipud = 0.0
fliplr = 0.50
mosaic = 1.0
mixup = 0.15
copy_paste = 0.30

[adaptive]
enabled = true
min_epochs = 80
max_epochs = 320
small_dataset_threshold = 300
medium_dataset_threshold = 1200

[export]
half = true
simplify = true
dynamic = false
batch = 1
