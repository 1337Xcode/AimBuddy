plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0'
}

// Single source of truth: edit aimbuddy.versionName and aimbuddy.versionCode
// in the root gradle.properties. APK metadata, BuildConfig, the AIMBUDDY_VERSION
// CMake define (used by native i18n / ImGui title), and the release workflow
// all read those two values.
def aimbuddyVersionName = providers.gradleProperty('aimbuddy.versionName').getOrElse('0.0.0-dev')
def aimbuddyVersionCode = providers.gradleProperty('aimbuddy.versionCode').getOrElse('1').toInteger()

// The default model lives once, in the store's folder (model/aimbuddy-general). The build copies it
// into the app's assets under the names the native code loads it by, so a first run needs no
// connection. The app tells it apart from a downloaded copy by its version (see BundledModel.kt).
def bundledModelDir = layout.buildDirectory.dir('generated/bundledModel')
def copyBundledModel = tasks.register('copyBundledModel', Copy) {
    from(rootProject.file('model/aimbuddy-general')) {
        include 'model.param', 'model.bin', 'model.json'
        rename 'model.param', 'yolo26n-opt.param'
        rename 'model.bin', 'yolo26n-opt.bin'
    }
    into(bundledModelDir.map { it.dir('models') })
}

// ---------------------------------------------------------------------------
// Release signing.
//
// Android identifies an installed app by (applicationId, signing certificate).
// If two APKs share applicationId "com.aimbuddy" but were signed with different
// certificates, the installer refuses the second one with:
//
//     "App not installed as package conflicts with an existing package"
//
// The release build previously used `signingConfigs.debug`, whose keystore is
// per-machine and is auto-generated from scratch on a fresh CI runner. Every
// build therefore produced a different certificate, so no released APK could
// ever be installed over another. The release key must instead be a single
// fixed keystore.
//
// Resolution order:
//   1. keystore.properties in the repo root (local releases; git-ignored)
//   2. AIMBUDDY_KEYSTORE_* environment variables (CI)
//   3. neither -> local builds fall back to the debug key with a loud warning;
//      CI builds fail hard so an unupgradable APK can never be published.
// ---------------------------------------------------------------------------
def releaseKeystore = [:]
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def props = new Properties()
    // Decode as UTF-8 and drop a leading BOM. Properties.load(InputStream) assumes
    // ISO-8859-1, so a BOM-prefixed file (which both Notepad and PowerShell's
    // `Set-Content -Encoding utf8` produce) would parse the first key as
    // "\uFEFFstoreFile" and silently fall back to debug signing.
    def text = keystorePropsFile.getText('UTF-8')
    if (text.startsWith('\uFEFF')) {
        text = text.substring(1)
    }
    props.load(new StringReader(text))

    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !props.getProperty(it)?.trim()
    }
    if (missing) {
        throw new GradleException("keystore.properties is missing required key(s): ${missing.join(', ')}")
    }
    releaseKeystore = [
        source       : 'keystore.properties',
        storeFile    : props.getProperty('storeFile').trim(),
        storePassword: props.getProperty('storePassword').trim(),
        keyAlias     : props.getProperty('keyAlias').trim(),
        keyPassword  : props.getProperty('keyPassword').trim(),
    ]
} else if (System.getenv('AIMBUDDY_KEYSTORE_FILE')) {
    releaseKeystore = [
        source       : 'AIMBUDDY_KEYSTORE_* environment',
        storeFile    : System.getenv('AIMBUDDY_KEYSTORE_FILE'),
        storePassword: System.getenv('AIMBUDDY_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('AIMBUDDY_KEY_ALIAS'),
        keyPassword  : System.getenv('AIMBUDDY_KEY_PASSWORD'),
    ]
}
// rootProject.file() leaves absolute paths untouched and resolves relative ones
// against the repo root, so both `storeFile=upload.jks` and an absolute CI path work.
def releaseKeystoreFile = releaseKeystore.storeFile ? rootProject.file(releaseKeystore.storeFile) : null
def hasReleaseKeystore = releaseKeystoreFile != null && releaseKeystoreFile.exists()
if (releaseKeystoreFile != null && !hasReleaseKeystore) {
    logger.warn("AimBuddy: keystore configured via ${releaseKeystore.source} but ${releaseKeystoreFile} does not exist.")
}

android {
    namespace = 'com.aimbuddy'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.aimbuddy"
        minSdk = 30  // Android 11+ for HardwareBuffer support
        targetSdk = 35
        versionCode = aimbuddyVersionCode
        versionName = aimbuddyVersionName

        // Only build for arm64-v8a; covers all modern Android flagship and mid-range phones.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // AIMBUDDY_VERSION reaches CMake as a cache variable; CMakeLists.txt
                // promotes it to a compile definition for utils/i18n.h. Pass it bare:
                // CMake adds the string quotes, and embedding them here would
                // double-quote the define and break the build.
                arguments "-DANDROID_STL=c++_static",
                          "-DANDROID_ARM_NEON=TRUE",
                          "-DAIMBUDDY_VERSION=${aimbuddyVersionName}"
            }
        }

        buildConfigField "String", "AIMBUDDY_VERSION", "\"${aimbuddyVersionName}\""
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = releaseKeystoreFile
                storePassword = releaseKeystore.storePassword
                keyAlias = releaseKeystore.keyAlias
                keyPassword = releaseKeystore.keyPassword
                // v1 (JAR signing) only matters below API 24 and costs ~93 KB of
                // per-entry digests in MANIFEST.MF/CERT.SF. minSdk is 30, so every
                // device that can install this verifies via v2/v3.
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key only for local throwaway builds; the
            // taskGraph check below turns that fallback into a hard error on CI.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            jniDebuggable = false
            pseudoLocalesEnabled = false
            zipAlignEnabled = true
            ndk {
                debugSymbolLevel = 'none'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // A separate application id lets a debug build be installed next to the release build
            // (they are signed with different keys, so they could not replace each other).
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            debuggable = true
            jniDebuggable = false
            ndk {
                debugSymbolLevel = 'none'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DAIMBUDDY_DEBUG_HOOKS=ON"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = 'src/main/cpp/CMakeLists.txt'
            version = '3.22.1'
        }
    }

    // Source sets for assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', bundledModelDir]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        compose = true
        prefab = true
        buildConfig = true
        // IHelperHost: how the app talks to the touch helper service that Shizuku starts.
        aidl = true
    }

    packaging {
        jniLibs {
            // Extract the native libraries to disk at install. libaimtouch.so is a program that
            // Shizuku or root must be able to execute, and only a file on disk can be executed.
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            // Strip unnecessary resource files from the APK
            excludes += [
                'META-INF/*.kotlin_module',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'kotlin/**',
                '**.proto'
            ]
        }
    }

    buildToolsVersion = '36.0.0'
    ndkVersion = '29.0.13113456 rc1'
}

// Assets are merged only after the model has been copied.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach { dependsOn copyBundledModel }

// Guard: never let a release APK leave CI signed with an ephemeral debug key.
// A debug-signed release is fine locally (fast install-and-test loop) but if it
// is published, users can never upgrade to or from it, because the next build's
// certificate will differ and the installer reports a package conflict.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.path.startsWith("${project.path}:") && it.name ==~ /(?i)(assemble|bundle|package|install)Release/
    }
    if (!buildsRelease) {
        return
    }
    if (hasReleaseKeystore) {
        logger.lifecycle("AimBuddy: signing release with ${releaseKeystoreFile} (from ${releaseKeystore.source})")
        return
    }
    def message = "No release keystore configured. Set AIMBUDDY_KEYSTORE_FILE / " +
                  "AIMBUDDY_KEYSTORE_PASSWORD / AIMBUDDY_KEY_ALIAS / AIMBUDDY_KEY_PASSWORD, " +
                  "or create keystore.properties in the repo root. See README > Release Signing."
    if (System.getenv('CI')) {
        throw new GradleException("Refusing to build a publishable release APK: ${message}")
    }
    logger.warn("AimBuddy WARNING: release APK will be signed with the local debug key. ${message}")
    logger.warn("AimBuddy WARNING: do NOT distribute this APK. It cannot be upgraded by a properly signed build.")
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // AndroidSVG
    implementation 'com.caverock:androidsvg:1.4'

    // Jetpack Compose — use latest BOM for coordinated dependency versions
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // StateFlow, which carries the assist's state from the service to the screen
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    // Debug-only: keep tooling preview off the release build
    debugImplementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Optional non-root input backend (Shizuku)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
