// Bundles the default model into the app.
//
// The default model lives once, in the store's folder (model/aimbuddy-general). The build copies it
// into the app's assets under the names the native code loads it by, so a first run needs no
// connection. The app tells it apart from a downloaded copy by its version (see BundledModel.kt).

/** Copies the default model's files into an assets folder, under the names the native code loads. */
abstract class CopyBundledModel extends DefaultTask {

    @InputDirectory
    abstract DirectoryProperty getModelDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        File target = outputDir.get().dir('models').asFile
        target.deleteDir()
        target.mkdirs()
        def names = ['model.param': 'yolo26n-opt.param', 'model.bin': 'yolo26n-opt.bin', 'model.json': 'model.json']
        names.each { source, name ->
            File file = new File(modelDir.get().asFile, source)
            if (!file.isFile()) {
                // An app without its model cannot start, so a build without it must not succeed.
                throw new GradleException("The model to bundle is missing: ${file}")
            }
            java.nio.file.Files.copy(file.toPath(), new File(target, name).toPath())
        }
    }
}

def copyBundledModel = tasks.register('copyBundledModel', CopyBundledModel) {
    modelDir.set(rootProject.layout.projectDirectory.dir('model/aimbuddy-general'))
    outputDir.set(layout.buildDirectory.dir('generated/bundledModel'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyBundledModel, CopyBundledModel::getOutputDir)
    }
}
