// Generates the app's launcher icon: a field of TV static that is the whole icon.
//
// Nothing is drawn in it: no frame, no shape, no shading and no flat background. The static fills
// the full 108 dp of the adaptive icon, so whatever shape the launcher cuts it to (circle, squircle,
// rounded square, teardrop) is static right to its edge. The back layer is static too, so no flat
// color can show through, and the one color version for themed icons is the same static, where the
// level of each grain is how much of the theme's color shows.
//
// Every grain is an independent random grey from black to white. The seed is new in every build, so
// every build, and so every reinstall of it, has a pattern of its own. The build prints the seed,
// and -Paimbuddy.iconSeed=<number> makes the same icon again. The floating button is made of the
// same kind of static when the overlay appears (see StaticBubbleView and StaticField.kt).

import java.awt.image.BufferedImage
import javax.imageio.ImageIO

/** Draws the launcher icon's three pictures into a folder of drawables: the front, the back, and a one color front. */
abstract class GenerateStaticIcon extends DefaultTask {

    // An adaptive icon is 108 dp square. At four pixels to the dp that is a 432 pixel picture.
    private static final int SIZE = 432
    private static final int CELL = 8                     // one grain of static, in pixels: 2 dp

    @Input
    abstract Property<Long> getSeed()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        System.setProperty('java.awt.headless', 'true')
        long value = seed.get()
        File folder = outputDir.get().dir('drawable-nodpi').asFile
        folder.mkdirs()
        // The themed version repeats the front's grains, so it is the same picture in one color.
        ImageIO.write(noise(new Random(value), false), 'png', new File(folder, 'ic_launcher_foreground.png'))
        ImageIO.write(noise(new Random(value), true), 'png', new File(folder, 'ic_launcher_monochrome.png'))
        ImageIO.write(noise(new Random(value + 1), false), 'png', new File(folder, 'ic_launcher_background.png'))
        logger.lifecycle("Launcher icon seed ${value} (-Paimbuddy.iconSeed=${value} makes the same icon again)")
    }

    /** A field of static. Each grain is a random level from 0 to 255, any level as likely as any other. */
    private static BufferedImage noise(Random random, boolean monochrome) {
        int cells = SIZE.intdiv(CELL)
        BufferedImage image = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        for (int row = 0; row < cells; row++) {
            for (int column = 0; column < cells; column++) {
                int level = random.nextInt(256)
                int argb = monochrome ? (level << 24) | 0xFFFFFF : (0xFF << 24) | (level << 16) | (level << 8) | level
                for (int y = 0; y < CELL; y++) {
                    for (int x = 0; x < CELL; x++) {
                        image.setRGB(column * CELL + x, row * CELL + y, argb)
                    }
                }
            }
        }
        return image
    }
}

def generateStaticIcon = tasks.register('generateStaticIcon', GenerateStaticIcon) {
    seed.set(providers.gradleProperty('aimbuddy.iconSeed').map { it.toLong() }.orElse(System.nanoTime()))
    outputDir.set(layout.buildDirectory.dir('generated/staticIcon'))
    // A new pattern every build: this task never counts as up to date.
    outputs.upToDateWhen { false }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(generateStaticIcon, GenerateStaticIcon::getOutputDir)
    }
}
