// Generates the app's launcher icon: a TV screen full of static.
//
// The noise comes from a random seed that is new in every build, so every build, and so every
// reinstall of it, has a pattern of its own. Pass -Paimbuddy.iconSeed=<number> to get the same
// icon again. The icon is an adaptive one: the static screen is the foreground on a plain dark
// background (see res/mipmap-anydpi/ic_launcher.xml), and a one color version of it is made for
// phones with themed icons.

import java.awt.AlphaComposite
import java.awt.BasicStroke
import java.awt.Color
import java.awt.Graphics2D
import java.awt.Rectangle
import java.awt.RadialGradientPaint
import java.awt.RenderingHints
import java.awt.TexturePaint
import java.awt.geom.Point2D
import java.awt.geom.RoundRectangle2D
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

/** Draws the launcher icon's foreground, and its one color version, into a folder of drawables. */
abstract class GenerateStaticIcon extends DefaultTask {

    // An adaptive icon is 108 dp square and its visible part is the middle 72 dp, so everything that
    // matters stays inside it. At four pixels to the dp that is a 432 pixel picture.
    private static final int SIZE = 432
    private static final int CELL = 6                     // one grain of static, in pixels
    private static final float BODY_X = 102, BODY_Y = 126, BODY_W = 228, BODY_H = 180, BODY_ARC = 48
    private static final float SCREEN_INSET = 12, SCREEN_ARC = 34

    @Input
    abstract Property<Long> getSeed()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        System.setProperty('java.awt.headless', 'true')
        File folder = outputDir.get().dir('drawable-nodpi').asFile
        folder.mkdirs()
        ImageIO.write(draw(new Random(seed.get()), false), 'png', new File(folder, 'ic_launcher_foreground.png'))
        ImageIO.write(draw(new Random(seed.get()), true), 'png', new File(folder, 'ic_launcher_monochrome.png'))
    }

    /** One grain of the screen: mostly mid gray, with the odd bright or dark one and a few streaks across. */
    private static BufferedImage noise(Random random, boolean monochrome) {
        int cells = SIZE / CELL
        BufferedImage image = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        Set<Integer> streaks = [random.nextInt(cells), random.nextInt(cells), random.nextInt(cells)] as Set
        for (int row = 0; row < cells; row++) {
            for (int column = 0; column < cells; column++) {
                int level = (int) Math.max(0, Math.min(255, 128 + random.nextGaussian() * 62))
                if (streaks.contains(row)) {
                    level = (level + 255).intdiv(2)
                }
                // Themed icons are tinted with one color, so the static is the see-through-ness.
                int argb = monochrome ? ((40 + (level * 215).intdiv(255)) << 24) | 0xFFFFFF : (0xFF << 24) | (level << 16) | (level << 8) | level
                for (int y = 0; y < CELL; y++) {
                    for (int x = 0; x < CELL; x++) {
                        image.setRGB(column * CELL + x, row * CELL + y, argb)
                    }
                }
            }
        }
        return image
    }

    private static BufferedImage draw(Random random, boolean monochrome) {
        BufferedImage image = new BufferedImage(SIZE, SIZE, BufferedImage.TYPE_INT_ARGB)
        Graphics2D g = image.createGraphics()
        g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)

        // The set: a rounded body, and the screen inside it.
        def body = new RoundRectangle2D.Float(BODY_X, BODY_Y, BODY_W, BODY_H, BODY_ARC, BODY_ARC)
        def screen = new RoundRectangle2D.Float((float) (BODY_X + SCREEN_INSET), (float) (BODY_Y + SCREEN_INSET),
                (float) (BODY_W - 2 * SCREEN_INSET), (float) (BODY_H - 2 * SCREEN_INSET), SCREEN_ARC, SCREEN_ARC)
        g.setPaint(monochrome ? Color.WHITE : new Color(0x3A3A42))
        g.fill(body)
        if (!monochrome) {
            // A light edge along the body, so it reads against the dark background.
            g.setPaint(new Color(255, 255, 255, 40))
            g.setStroke(new BasicStroke(3f))
            g.draw(new RoundRectangle2D.Float((float) (BODY_X + 1.5), (float) (BODY_Y + 1.5), (float) (BODY_W - 3), (float) (BODY_H - 3), BODY_ARC, BODY_ARC))
        }

        // The static fills the screen; where it is drawn it replaces what was under it.
        g.setComposite(AlphaComposite.Src)
        g.setPaint(new TexturePaint(noise(random, monochrome), new Rectangle(0, 0, SIZE, SIZE)))
        g.fill(screen)

        // The glass is darker towards the edges. Left out of the themed version, which has one color.
        if (!monochrome) {
            g.setComposite(AlphaComposite.SrcOver)
            float[] stops = [0.0f, 0.55f, 1.0f]
            Color[] colors = [new Color(0, 0, 0, 0), new Color(0, 0, 0, 0), new Color(0, 0, 0, 150)]
            g.setPaint(new RadialGradientPaint(new Point2D.Float((float) (SIZE / 2), (float) (SIZE / 2)), 150f, stops, colors))
            g.fill(screen)
        }
        g.dispose()
        return image
    }
}

def generateStaticIcon = tasks.register('generateStaticIcon', GenerateStaticIcon) {
    seed.set(providers.gradleProperty('aimbuddy.iconSeed').map { it.toLong() }.orElse(System.nanoTime()))
    outputDir.set(layout.buildDirectory.dir('generated/staticIcon'))
    // A new pattern every build: this task never counts as up to date.
    outputs.upToDateWhen { false }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.res?.addGeneratedSourceDirectory(generateStaticIcon, GenerateStaticIcon::getOutputDir)
    }
}
